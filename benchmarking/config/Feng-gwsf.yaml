# Benchmark Configuration for Feng-gwsf
# Auto-generated by inspect_datasets.py

dataset_path: "/data/origin/Feng-gwsf.h5ad"
output_dir: "benchmarking/results/Feng-gwsf"

# Dataset column configuration
perturbation_column: "perturbation"
control_label: null  # Auto-detects 'control'
gene_name_column: null  # Uses var.index

# Quality control parameters - set to null to use adaptive calculation
qc_params: null  # Will be calculated adaptively based on data distribution

# Resource limits - Tier 2 (medium datasets)
# time_limit raised from 21600 (6 h) to 32400 (9 h): crispyx_de_wilcoxon on
# this dataset takes ~83 chunks × ~310 s/chunk ≈ 7.2 h wall time at 32 threads.
resource_limits:
  time_limit: 32400  # 9 hours per method
  memory_limit: 128.0  # GB per method

# Parallelization configuration (6 GB/core on HPC)
parallel_config:
  n_cores: 32  # 128 GB, 32 cores for all datasets

# Scanpy DE references run on a seeded random subset of perturbations (each
# vs the full control): the full runs timed out or ran out of memory. The
# input is pre-normalized over all cells, so each tested perturbation's
# result equals the full run's. Sizes keep the run inside the 24 h method
# limit; the same size and seed as PyDESeq2 selects the same perturbations.
scanpy_max_perturbations:
  wilcoxon: 25
scanpy_subset_seed: 0
method_resource_limits:
  scanpy_de_wilcoxon:
    memory_limit: 240.0
    time_limit: 259200  # 72 h: >30 min per perturbation against a 200k+-cell control

# Adaptive QC mode
force_restandardize: false  # Set to true to regenerate standardized files
adaptive_qc_mode: conservative  # or 'aggressive'

# Methods to run (null = run all available methods)
methods_to_run: null

# Progress and output options
show_progress: true
quiet: false