# Benchmark Configuration for Huang-HCT116
# Auto-generated by inspect_datasets.py

dataset_path: "data/origin/Huang-HCT116.h5ad"  # relative to the repo, so standardized links resolve inside and outside the container
output_dir: "benchmarking/results/Huang-HCT116"

# Dataset column configuration
perturbation_column: "gene_target"
control_label: "Non-Targeting"  # Explicit: 'CTRL' (the chymotrypsin-like gene, 171/211 cells) is a perturbation, not the control
gene_name_column: null  # Uses var.index

# Quality control parameters - set to null to use adaptive calculation
# Fixed to the values the adaptive (conservative) calculation gives for this
# dataset (cached in .benchmark_cache/config.json): the adaptive scan reads the
# whole matrix from Lustre twice per job, before any timed method.
qc_params:
  min_genes: 50
  min_cells_per_perturbation: 47
  min_cells_per_gene: 5
  chunk_size: 4096

# Resource limits - Tier 3 (large datasets)
resource_limits:
  time_limit: 86400  # 24 hours per method
  memory_limit: 128.0  # GB per method

# Parallelization configuration
parallel_config:
  n_cores: 32  # 128 GB, 32 cores for all datasets


# Accuracy references on a seeded random subset of perturbations (each vs
# the full control): Scanpy runs out of memory at 128 GB on the full data and
# PyDESeq2 cannot load it. The same size and seed give Scanpy and PyDESeq2
# the same 50 perturbations (200 was too slow: Scanpy
# Wilcoxon >9.7 h unfinished). Relaxed limits apply to these accuracy runs
# only; the full-data Scanpy memory_limit results are the performance record
# (kept in .benchmark_cache_full/).
pydeseq2_max_perturbations: 50
pydeseq2_subset_seed: 0
scanpy_max_perturbations:
  t-test: 50
  wilcoxon: 50
scanpy_subset_seed: 0
method_resource_limits:
  scanpy_de_t_test:
    memory_limit: 240.0
    time_limit: 259200
  scanpy_de_wilcoxon:
    memory_limit: 240.0
    time_limit: 259200
  pertpy_de_pydeseq2:
    # Each fit holds the full control dense (166,204 x 35,120 float64 =
    # 43.5 GiB for HCT116); 240 GB failed every fit.
    memory_limit: 480.0
    time_limit: 259200

# Adaptive QC mode
force_restandardize: false  # Set to true to regenerate standardized files
adaptive_qc_mode: conservative  # or 'aggressive'

# Methods to run (null = run all available methods)
# PyDESeq2 and Scanpy DE on a perturbation subset (see above); no edgeR
methods_to_run:
  - crispyx_qc_filtered
  - crispyx_pb_avg_log
  - crispyx_pb_pseudobulk
  - crispyx_de_t_test
  - crispyx_de_wilcoxon
  - crispyx_de_nb_glm
  - scanpy_qc_filtered
  - scanpy_de_t_test
  - scanpy_de_wilcoxon
  - pertpy_de_pydeseq2

# Progress and output options
show_progress: true
quiet: false