# Benchmark Configuration for Huang-HCT116
# Auto-generated by inspect_datasets.py

dataset_path: "data/origin/Huang-HCT116.h5ad"  # relative to the repo, so standardized links resolve inside and outside the container
output_dir: "benchmarking/results/Huang-HCT116"

# Dataset column configuration
perturbation_column: "gene_target"
control_label: "Non-Targeting"  # Explicit: 'CTRL' (the chymotrypsin-like gene, 171/211 cells) is a perturbation, not the control
gene_name_column: null  # Uses var.index

# Quality control parameters - set to null to use adaptive calculation
# Fixed to the values the adaptive (conservative) calculation gives for this
# dataset (cached in .benchmark_cache/config.json): the adaptive scan reads the
# whole matrix from Lustre twice per job, before any timed method.
qc_params:
  min_genes: 50
  min_cells_per_perturbation: 47
  min_cells_per_gene: 5
  chunk_size: 4096

# Resource limits - Tier 3 (large datasets)
resource_limits:
  time_limit: 86400  # 24 hours per method
  memory_limit: 128.0  # GB per method

# Parallelization configuration
parallel_config:
  n_cores: 32  # 128 GB, 32 cores for all datasets

# Accuracy reruns of reference methods that fail on the full data
# (plan/2026-10-25_benchmark_rerun_plan.md §3.2). The same seeded
# perturbations score every method; <reference>_subset reruns a reference on
# them against the full control, <reference>_subset_ctrl against a seeded
# sample of control cells. The limits below apply to these reruns only;
# every full-data run keeps resource_limits.
accuracy_subset:
  n_perturbations: 50
  seed: 0
  max_control_cells: 20000
  memory_limit: 240.0
  time_limit: 259200  # 72 h

# Adaptive QC mode
force_restandardize: false  # Set to true to regenerate standardized files
adaptive_qc_mode: conservative  # or 'aggressive'

# Methods to run (null = run all available methods)
# Full-data references give the performance rows; those that fail are rerun
# on the accuracy subset (accuracy_subset above, *_subset method names).
methods_to_run:
  - crispyx_qc_filtered
  - crispyx_pb_avg_log
  - crispyx_pb_pseudobulk
  - crispyx_de_t_test
  - crispyx_de_wilcoxon
  - crispyx_de_nb_glm
  - scanpy_qc_filtered
  - scanpy_de_t_test
  - scanpy_de_wilcoxon
  - pertpy_de_pydeseq2

# Progress and output options
show_progress: true
quiet: false