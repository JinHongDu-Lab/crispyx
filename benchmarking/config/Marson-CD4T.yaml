# Benchmark Configuration for Marson-CD4T

# NOT IN THE MAIN BENCHMARK (decision 2026-10-25): Marson CD4+ T cells are a
# case study for crispyx's residual effects, on the full 4-donor file; its
# existing results here are kept but not rerun.
#
# NOTE: single-donor subset. This file holds donor D4 only, all in the
# Rest condition (1,749,091 cells; 1,737,645 after QC). The full Marson
# CD4+ T-cell screen has 4 donors (D1-D4, 7,386,295 cells, all Rest); the
# benchmark deliberately keeps D4 only. The file is the strict_qc subset
# from the Cardiomyocyte project (~/Cardiomyocyte/code/data/strict_qc/
# origin/Marson-CD4T.h5ad on hydra; full 4-donor file: .../data/origin/).
dataset_path: "/data/origin/Marson-CD4T.h5ad"
output_dir: "benchmarking/results/Marson-CD4T"

# Dataset column configuration
perturbation_column: "perturbation"
control_label: "non-targeting"  # Explicit: auto-detect silently matches the unrelated 'CTRL' perturbation (67 cells) instead
gene_name_column: null  # Uses var.index

# Quality control parameters - set to null to use adaptive calculation
qc_params: null  # Will be calculated adaptively based on data distribution

# Resource limits - Tier 3 (large datasets)
resource_limits:
  time_limit: 86400  # 24 hours per method
  memory_limit: 128.0  # GB per method

# Parallelization configuration
parallel_config:
  n_cores: 32  # 128 GB, 32 cores for all datasets

# Scanpy DE references run on a seeded random subset of perturbations (each
# vs the full control): the full runs timed out or ran out of memory. The
# input is pre-normalized over all cells, so each tested perturbation's
# result equals the full run's. Sizes keep the run inside the 24 h method
# limit; the same size and seed as PyDESeq2 selects the same perturbations.
scanpy_max_perturbations:
  wilcoxon: 200
scanpy_subset_seed: 0
method_resource_limits:
  scanpy_de_wilcoxon:
    memory_limit: 240.0

# Adaptive QC mode
force_restandardize: false  # Set to true to regenerate standardized files
adaptive_qc_mode: conservative  # or 'aggressive'

# Methods to run (null = run all available methods)
# Excluding NB-GLM methods (edgeR, PyDESeq2, crispyx NB-GLM)
methods_to_run:
  - crispyx_qc_filtered
  - crispyx_pb_avg_log
  - crispyx_pb_pseudobulk
  - crispyx_de_t_test
  - crispyx_de_wilcoxon
  - crispyx_de_nb_glm
  - scanpy_qc_filtered
  - scanpy_de_t_test
  - scanpy_de_wilcoxon

# Progress and output options
show_progress: true
quiet: false
